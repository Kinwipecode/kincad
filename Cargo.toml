[package]
name = "KINCAD"
version = "2026.36.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "dwgviewer"
path = "src/main.rs"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
iced = { git = "https://github.com/iced-rs/iced.git", rev = "23604ff22ab0aad9e00b9327cb7b8546ed84db39", features = ["image", "svg", "advanced", "canvas", "smol", "markdown"] }
bytemuck = { version = "1.25", features = ["derive"] }
glam = { version = "0.33", features = ["bytemuck"] }
rfd = "0.17"
env_logger = "0.11"
acadrust = { git = "https://github.com/hakanaktt/acadrust.git", rev = "88fdb556dc8a292931a52b52ba42fc322dd39c23", features = ["serde"] }
cadkernel = { git = "https://github.com/HakanSeven12/cadkernel.git", rev = "a3185be8189d78d6e93b4ea5b9238b184da4f3cf", features = ["acis", "offset"] }
cadkernel-constraints = { git = "https://github.com/HakanSeven12/cadkernel.git", rev = "a3185be8189d78d6e93b4ea5b9238b184da4f3cf" }
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tiff"] }
i18n-embed = { version = "0.16", features = ["fluent-system"] }
i18n-embed-fl = "0.10"
rust-embed = "8"
inventory = "0.3"
rustc-hash = "2"
sha2 = "0.10"
fontdb = "0.23"
ttf-parser = "0.25"
cosmic-text = "0.15"
unicode-bidi = "0.3"
lyon_tessellation = "1.0.20"

[dev-dependencies]
fluent-syntax = "0.12"
naga = { version = "27", features = ["wgsl-in"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_Foundation"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.3"
bincode = "1.3"
meshopt = "0.6.2"
i18n-embed = { version = "0.16", features = ["desktop-requester"] }
rayon = "1"
open = "5"
printpdf = { version = "0.9.1", default-features = false }
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "win-system-proxy"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
i18n-embed = { version = "0.16", features = ["web-sys-requester"] }
rust-embed = { version = "8", features = ["debug-embed"] }
console_error_panic_hook = "0.1"
log = "0.4"
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
bincode = "1.3"
web-sys = { version = "=0.3.85", features = [
    "Window",
    "Storage",
    "StorageManager",
    "Navigator",
    "Document",
    "Element",
    "HtmlAnchorElement",
    "Blob",
    "File",
    "Url",
    "Response",
    "Clipboard",
    "KeyboardEvent",
    "KeyboardEventInit",
    "EventInit",
    "EventTarget",
    "BeforeUnloadEvent",
    "console",
    "Node",
    "HtmlElement",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "ImageData",
] }
iced = { git = "https://github.com/iced-rs/iced.git", rev = "23604ff22ab0aad9e00b9327cb7b8546ed84db39", features = ["webgl", "fira-sans"] }

[patch.crates-io]
iced_core = { git = "https://github.com/iced-rs/iced.git", rev = "23604ff22ab0aad9e00b9327cb7b8546ed84db39" }
iced_widget = { git = "https://github.com/iced-rs/iced.git", rev = "23604ff22ab0aad9e00b9327cb7b8546ed84db39" }

# Kernel als Kopie im Projekt: sie trägt den Upstream-Fix a90a89b gegen Flächen
# ohne Netz (Randpunkte, die „ein Haar" auseinanderliegen, #1538) — der gepinnte
# Stand a3185be hat ihn nicht. Die Kopie bindet acadrust weiterhin an denselben
# rev wie oben, der Leser bleibt also unberührt. Beim Anheben des Kernels muss
# diese Sektion entfernt oder neu geschnitten werden (siehe vendor/UPSTREAM.md).
[patch."https://github.com/HakanSeven12/cadkernel.git"]
cadkernel = { path = "vendor/cadkernel" }
cadkernel-constraints = { path = "vendor/cadkernel/crates/cadkernel-constraints" }

[profile.release]
strip = true

# Debug-Build (dev.bat): Kernel und Leser optimiert, sonst braucht das Netz der
# ACIS-Koerper in der Debug-Stufe ein Vielfaches der Zeit. Die App selbst bleibt
# unoptimiert, damit Aenderungen schnell kompilieren.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package.cadkernel]
opt-level = 3
[profile.dev.package.spade]
opt-level = 3
[profile.dev.package.acadrust]
opt-level = 3
